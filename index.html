<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDI 供应链协同平台</title>
  <meta name="description" content="哈拉（Halal）认证：印尼强制准入门槛，权威认证，合规出海" />
  <link rel="stylesheet" href="css/style.css?v=20260826a" />
</head>
<body>

  <!-- ============================================================
       认证（独立模块页）
  ============================================================ -->
    <section class="section section-hero bg-white">
    <div class="container">
      <header class="section-header reveal">
        <h2 class="section-title">认证</h2>
        <p class="section-subtitle">很多中国食品、化妆品、保健品企业踩过的大坑</p>
      </header>

      <div class="hero-grid">
        <!-- 左侧文案 -->
        <div class="hero-text reveal reveal-left">
          <div class="badge-pill">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526" />
              <circle cx="12" cy="8" r="6" />
            </svg>
            权威认证，合规出海
          </div>
          <p class="hero-desc">
            产品品质过硬、价格有优势。海运订舱、清关资料全部备齐。到了印尼港口，
            却被直接扣货、退运、销毁。
          </p>
          <p class="hero-desc">
            <strong>原因只有一个：没有哈拉（Halal）认证。</strong>
            在印尼这个全球穆斯林人口最多的国家，哈拉认证不是加分项，而是强制性准入门槛。
            没有它，寸步难行。
          </p>
          <a href="training.html" class="btn-outline">
            点击进入
            <svg class="icon arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </a>
        </div>

        <!-- 右侧认证视觉 -->
        <div class="hero-visual">
          <div class="cert-visual">
            <!-- 外圈：顺时针慢速旋转 -->
            <div class="ring ring-outer"></div>
            <!-- 内圈：反向慢速旋转 -->
            <div class="ring ring-inner"></div>

            <div class="cert-core">
              <div class="cert-inner-wrap">
              <!-- 扩散光环（2 环慢速扩散） -->
              <div class="ripple-ring"></div>
              <div class="ripple-ring" style="animation-delay: 1.6s"></div>

              <!-- 绿色渐变主圆：极轻微呼吸 -->
              <div class="cert-circle"></div>

              <!-- 中心内容 -->
              <div class="cert-inner">
                <div class="cert-logo">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" />
                    <path d="m9 12 2 2 4-4" />
                  </svg>
                </div>
                <div class="cert-name">Halal</div>
                <div class="cert-sub">哈拉认证</div>
              </div>

              <!-- 6 个卫星圆点：认证图标组合（静止衬托主体） -->
              <div class="satellite" style="left: 95%; top: 50%;">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
                  <path d="m9 12 2 2 4-4" />
                </svg>
              </div>
              <div class="satellite" style="left: 72.5%; top: 88.97%;">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526" />
                  <circle cx="12" cy="8" r="6" />
                </svg>
              </div>
              <div class="satellite" style="left: 27.5%; top: 88.97%;">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 22h14" />
                  <path d="M19.27 13.73A2.5 2.5 0 0 0 17.5 13h-11A2.5 2.5 0 0 0 4 15.5V17a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1.5c0-.66-.26-1.3-.73-1.77Z" />
                  <path d="M14 13V8.5C14 7 15 7 15 5a3 3 0 0 0-3-3c-1.66 0-3 1-3 3s1 2 1 3.5V13" />
                </svg>
              </div>
              <div class="satellite" style="left: 5%; top: 50%;">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4" />
                  <path d="M14 13.12c0 2.38 0 6.38-1 8.88" />
                  <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02" />
                  <path d="M2 12a10 10 0 0 1 18-6" />
                  <path d="M2 16h.01" />
                  <path d="M21.8 16c.2-2 .131-5.354 0-6" />
                  <path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2" />
                  <path d="M8.65 22c.21-.66.45-1.32.57-2" />
                  <path d="M9 6.8a6 6 0 0 1 9 5.2v2" />
                </svg>
              </div>
              <div class="satellite" style="left: 27.5%; top: 11.03%;">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15" />
                  <path d="M11 12 5.12 2.2" />
                  <path d="m13 12 5.88-9.8" />
                  <path d="M8 7h8" />
                  <circle cx="12" cy="17" r="5" />
                  <path d="M12 18v-2h-.5" />
                </svg>
              </div>
              <div class="satellite" style="left: 72.5%; top: 11.03%;">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </div>
              </div><!-- /.cert-inner-wrap -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/main.js?v=20260826a"></script>
</body>
</html>
